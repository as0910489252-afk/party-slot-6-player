<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152b"><title>尾牙王者｜六人拉霸大對決</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header class="hero"><div class="eyebrow">PARTY GAME · REAL-TIME</div><h1>🎰 六人拉霸大對決</h1><p>六支手機連線・兩隊比拚・每人三次</p></header>
<section id="entry" class="panel"><h2>加入遊戲</h2><label>你的暱稱<input id="name" maxlength="16" placeholder="例如：小明"></label><label>選擇隊伍<select id="team"><option value="blue">🔵 藍隊</option><option value="red">🔴 紅隊</option></select></label><div class="actions"><button id="create" class="primary">建立新房間</button></div><div class="joinline"><input id="roomCode" maxlength="6" placeholder="輸入 6 碼房間碼" autocapitalize="characters"><button id="join">加入房間</button></div><p class="hint">建立房間的人把房間碼分享給另外 5 位玩家。所有手機都要開啟同一個網站。</p><p id="entryError" class="error" role="alert"></p></section>
<section id="game" class="hidden"><div class="roombar panel"><div><span class="muted">房間碼</span><strong id="roomCodeLabel">------</strong></div><button id="copyCode" class="small">複製房間碼</button><div id="connection" class="connection">連線中…</div></div><div class="scoreboard"><article class="score blue"><span>🔵 藍隊</span><strong id="blueScore">0</strong><small>分</small></article><div class="versus">VS</div><article class="score red"><span>🔴 紅隊</span><strong id="redScore">0</strong><small>分</small></article></div>
<section class="panel slot-panel"><div class="statusline"><span id="myIdentity">玩家</span><span id="remaining">剩餘 3 次</span></div><div class="reels"><span id="reel0">❔</span><span id="reel1">❔</span><span id="reel2">❔</span></div><p id="result" class="result">等候六位玩家加入…</p><button id="spin" class="spin primary" disabled>🎰 開始拉霸！</button><p class="hint">三個相同：50 分（777 為 100 分）；任兩個相同：10 分；其他：0 分。</p></section>
<section class="panel"><div class="section-title"><h2>玩家狀態</h2><span id="playerCount">0 / 6 人</span></div><div id="players" class="players"></div></section><section class="panel"><div class="section-title"><h2>最新紀錄</h2><span>即時同步</span></div><div id="history" class="history"><p class="muted">還沒有拉霸紀錄。</p></div></section><button id="reset" class="reset">重新開始本局</button><p class="hint center">注意：目前房間資料存在伺服器記憶體中，伺服器重啟後需要重新開房。</p></section></main><div id="toast" class="toast" role="status"></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
